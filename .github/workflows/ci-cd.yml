name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
      - name: Install Dependencies
        run: npm install --legacy-peer-deps
      - name: Run ESLint
        run: npm run lint

  format:
    name: Prettier Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
      - name: Install Dependencies
        run: npm install --legacy-peer-deps
      - name: Run Prettier check
        run: npm run format:check

  type-check:
    name: TypeScript Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
      - name: Install Dependencies
        run: npm install --legacy-peer-deps
      - name: Run TypeScript compiler
        run: npm run type-check

  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
      - name: Install Dependencies
        run: npm install --legacy-peer-deps
      - name: Run Jest test suite
        run: npm test

  build-android:
    name: Native Android Build Check
    runs-on: ubuntu-latest
    needs: [lint, format, type-check, test]

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Compile Debug APK
        run: npm run build:android:debug

  notify:
    name: Pipeline Status Notifications
    runs-on: ubuntu-latest
    needs: [lint, format, type-check, test, build-android]
    if: always()

    steps:
      - name: Notify Slack of Build Result
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_TITLE: 'NeuroPilot Pipeline Execution Status'
          SLACK_COLOR: ${{ (needs.lint.result == 'success' && needs.format.result == 'success' && needs.type-check.result == 'success' && needs.test.result == 'success' && needs.build-android.result == 'success') && '#32a852' || '#a83232' }}
          SLACK_MESSAGE: |
            *Commit*: `${{ github.event.head_commit.message }}`
            *Author*: ${{ github.actor }}
            *Workflow Status*: ${{ (needs.lint.result == 'success' && needs.format.result == 'success' && needs.type-check.result == 'success' && needs.test.result == 'success' && needs.build-android.result == 'success') && 'SUCCESS 🎉' || 'FAILURE 🔴' }}
            *Lint Check*: ${{ needs.lint.result }}
            *Prettier Check*: ${{ needs.format.result }}
            *TypeScript Check*: ${{ needs.type-check.result }}
            *Unit Tests Status*: ${{ needs.test.result }}
            *Android Build Status*: ${{ needs.build-android.result }}
            *Run URL*: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        continue-on-error: true
