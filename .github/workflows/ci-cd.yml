name: NeuroPilot CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Code Quality Verification (Lint, Style, Types, Tests)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run CI Verification Pipeline
        run: npm run ci

  build-android:
    name: Native Android Build Check
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Compile Debug APK
        run: npm run build:android:debug

  notify:
    name: Pipeline Status Notifications
    runs-on: ubuntu-latest
    needs: [validate, build-android]
    if: always()

    steps:
      - name: Notify Slack of Build Result
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_TITLE: 'NeuroPilot Pipeline Execution Status'
          SLACK_COLOR: ${{ needs.validate.result == 'success' && needs.build-android.result == 'success' && '#32a852' || '#a83232' }}
          SLACK_MESSAGE: |
            *Commit*: `${{ github.event.head_commit.message }}`
            *Author*: ${{ github.actor }}
            *Workflow Status*: ${{ needs.validate.result == 'success' && needs.build-android.result == 'success' && 'SUCCESS 🎉' || 'FAILURE 🔴' }}
            *Code Quality Status*: ${{ needs.validate.result }}
            *Android Build Status*: ${{ needs.build-android.result }}
            *Run URL*: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        continue-on-error: true
